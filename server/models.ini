; llama-server 라우터 모델 프리셋 (docs/vulkan-tuning.md 근거)
; 키 = CLI 인자에서 대시 제거. 자세한 형식: llama.cpp tools/server/README.md "Model presets"
version = 1

; 전 모델 공통 (890M Vulkan 튜닝)
[*]
flash-attn = on
n-gpu-layers = 99
no-mmap = true
ub = 512

; 일상 주력 — 부팅 시 자동 로드. 리즈닝 + 비전(mmproj 동봉 디렉터리)
; reasoning-budget: 사고 토큰 상한 — 무제한이면 자동화 API 호출이 사고만 하다 끝남
[gemma4-26b-a4b]
c = 32768
load-on-startup = true
reasoning-budget = 2048

; 추론 특화 (Harmony 템플릿은 jinja 기본값으로 처리됨)
[gpt-oss-20b-MXFP4]
c = 32768

; 경량 고속
[Qwen3-4B-Instruct-2507-Q4_K_M]
c = 16384

; 현세대 MoE — 코딩/에이전트/장문 컨텍스트 특화 (2026-08-16 편입)
; -b/-ub 1024: HX 370 Vulkan 크래시(#22425) 워크어라운드 필수
; MTP 드래프트: 예측성 콘텐츠 +23%, 산문 본전 (실측). 비전(mmproj)은 #27146 OOM으로 보류
[Qwen3.6-35B-A3B-UD-Q4_K_S]
c = 32768
b = 1024
ub = 1024
spec-type = draft-mtp
model-draft = /home/amd-ai/models/mtp-Qwen3.6-35B-A3B-Q8_0.gguf
ngld = 99
