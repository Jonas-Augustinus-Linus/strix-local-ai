; llama-server 라우터 모델 프리셋 (docs/vulkan-tuning.md 근거)
; 키 = CLI 인자에서 대시 제거. 자세한 형식: llama.cpp tools/server/README.md "Model presets"
; 2026-08-18: 전 라인업 무검열(abliterated)판으로 교체 — 사용자 지침
;   (검열/거부 학습의 성능세 제거). 기존 공식판 파일은 롤백용으로 디스크에 보존.
version = 1

; 전 모델 공통 (890M Vulkan 튜닝)
[*]
flash-attn = on
n-gpu-layers = 99
no-mmap = true
ub = 512

; 일상 주력 — 부팅 시 자동 로드. 리즈닝 + 비전(mmproj 동봉 디렉터리)
; huihui QAT-q4_0 베이스 abliterated → Q4_K (원본과 같은 QAT 계보)
; reasoning-budget: 사고 토큰 상한 — 무제한이면 자동화 API 호출이 사고만 하다 끝남
[gemma4-26b-a4b-abl]
c = 32768
load-on-startup = true
reasoning-budget = 2048

; 추론 특화 (Harmony 템플릿은 jinja 기본값으로 처리됨) — bartowski, MXFP4_MOE 네이티브 포맷
[gpt-oss-20b-abl-MXFP4]
c = 32768

; 경량 고속 — mradermacher i1
[Qwen3-4B-2507-abl-i1-Q4_K_M]
c = 16384

; 품질 최우선 스위칭 모델 — 최신 세대 덴스 27B (느림 감수: 대역폭 바운드 ~5 t/s)
; **우리가 만든 무검열+한국어 보정 KO-i1 Q6_K** (3차 릴리스 산출물, 자가소비)
;   정적판 대비 한국어 KLD -23.7%(9.1σ). 한국어 최종 검수/고품질 작업용. 비전 mmproj 동봉
; GTT 예산: Q6_K 20.8G + KV(16k) ~2G + 컴퓨트 ~1.5G ≈ 24G — 26G 상한에서 동작
;   MTP 드래프트(+2.9G)나 c=32768은 상한 초과 → 보류 (G6 원칙)
[qwen3.8-27b-abl]
c = 16384

; 무검열 비교 모델 — orcarouter판 Qwen3.8-27B (FP8→GGUF 계보, chimingw 미러 Q6_K 20.9G).
;   우리 KO-i1(huihui 계보, 한국어 보정)과 A/B 비교용. 같은 27B 덴스라 GTT 예산 동일(≈24G).
;   무개조 보존 릴리스(no train/merge/align change), SHA256 검증, Apache 2.0. 비전 mmproj 동봉.
[qwen3.8-27b-orca]
c = 16384

; 현세대 MoE — 코딩/에이전트/장문 컨텍스트 특화. huihui abliterated (MTP 텐서 본체 포함)
; -b/-ub 1024: HX 370 Vulkan 크래시(#22425) 워크어라운드 필수
; MTP 드래프트: 공식 mtp 파일 유지 — abliterated 본체와의 수용률은 실측 확인 필요
[Qwen3.6-35B-A3B-abl-Q4_K]
c = 32768
b = 1024
ub = 1024
spec-type = draft-mtp
model-draft = /home/amd-ai/models/mtp-Qwen3.6-35B-A3B-Q8_0.gguf
ngld = 99
