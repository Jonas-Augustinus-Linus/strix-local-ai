<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strix 이미지 생성</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#14151a; color:#e8e8 ea;
         display:flex; flex-direction:column; align-items:center; padding:24px; gap:16px; }
  h1 { font-size:20px; margin:4px 0 0; color:#fff; }
  .sub { color:#888; font-size:13px; margin:0 0 8px; }
  .panel { width:100%; max-width:560px; display:flex; flex-direction:column; gap:12px; }
  label { font-size:13px; color:#aaa; margin-bottom:-6px; }
  textarea, select, input { width:100%; padding:12px; border-radius:10px; border:1px solid #333;
         background:#1e1f26; color:#eee; font-size:15px; font-family:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  button { padding:14px; border:0; border-radius:10px; background:#4f7cff; color:#fff;
         font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { background:#333; color:#777; cursor:wait; }
  #status { text-align:center; color:#9aa; font-size:14px; min-height:20px; }
  #gallery { width:100%; max-width:560px; display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; }
  .thumb { width:100%; border-radius:12px; }
  .bar { height:6px; background:#222; border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:#4f7cff; transition:width .2s; }
</style>
</head>
<body>
  <h1>🎨 Strix 이미지 생성</h1>
  <p class="sub">무검열 로컬 이미지 (Illustrious / NoobAI / Pony)</p>
  <div id="modebar" style="width:100%; max-width:560px; display:none; padding:12px; border-radius:10px; margin-bottom:4px; text-align:center;"></div>
  <div class="panel">
    <label>무엇을 그릴까요? <span style="color:#4f7cff">(한국어로 써도 OK — 아래 변환 버튼)</span></label>
    <textarea id="prompt" placeholder="한국어: 흰머리 소녀, 기모노, 벚꽃 정원   또는   영어 태그: 1girl, white hair, kimono, cherry blossoms"></textarea>
    <button id="tr" onclick="toEng()" style="background:#2a7d5f; padding:10px; font-size:14px;">🇰🇷→🇺🇸 한국어를 영어 태그로 변환</button>
    <label>빼고 싶은 것 (선택 — 비워두면 자동)</label>
    <input id="neg" value="">
    <div class="row">
      <div>
        <label>모델</label>
        <select id="model">
          <option>Illustrious-XL-v2.0.safetensors</option>
          <option>NoobAI-XL-v1.1.safetensors</option>
          <option>Pony-Diffusion-v6-XL.safetensors</option>
        </select>
      </div>
      <div>
        <label>크기</label>
        <select id="size">
          <option value="1024x1024">정사각 1024</option>
          <option value="832x1216">세로 (인물)</option>
          <option value="1216x832">가로 (풍경)</option>
        </select>
      </div>
      <div>
        <label>장수</label>
        <select id="batch">
          <option value="1">1장</option>
          <option value="2">2장</option>
          <option value="4">4장</option>
        </select>
      </div>
    </div>
    <label style="display:flex; align-items:center; gap:8px; margin:0; cursor:pointer; color:#ccc;">
      <input type="checkbox" id="autoq" checked style="width:auto;">
      품질 태그 자동 추가 (모델별 최적화 — Pony score 태그 등)
    </label>
    <label>🔍 고품질 (Hires Fix — 디테일·해상도↑)</label>
    <select id="hires">
      <option value="0">끄기 (빠름, ~1분)</option>
      <option value="1.5" selected>1.5배 정제 (~2.5분, 1248×1824)</option>
      <option value="2.0">2.0배 초고해상 (~4.5분, 1664×2432)</option>
    </select>
    <label style="margin-top:6px;">🎯 참조 이미지로 제어 (선택)</label>
    <select id="cnmode" onchange="updateCnUI()">
      <option value="off">끄기 (프롬프트만으로 생성)</option>
      <option value="pose">🕺 자세 — 참조의 포즈를 따라감</option>
      <option value="canny">📐 구도 — 참조의 윤곽/구도를 유지 (사진→애니 변환)</option>
    </select>
    <div id="cnpanel" style="display:none; flex-direction:column; gap:10px;">
      <div class="row" style="align-items:center;">
        <button id="poseBtn" onclick="document.getElementById('poseFile').click()" style="background:#5a4a7d; padding:10px; font-size:14px; flex:2;">📎 참조 사진 올리기</button>
        <button id="poseClear" onclick="clearPose()" style="background:#444; padding:10px; font-size:14px; flex:1; display:none;">✕ 해제</button>
      </div>
      <input type="file" id="poseFile" accept="image/*" style="display:none;" onchange="uploadPose(this)">
      <div id="posePreview" style="display:none; color:#8a9; font-size:13px;"></div>
      <div id="presets" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      <label style="margin:0; color:#aaa;">제어 강도: <b id="strVal">1.0</b> <span style="color:#777;font-size:12px;">(낮으면 자유, 높으면 참조에 충실)</span></label>
      <input type="range" id="strength" min="0.3" max="1.2" step="0.1" value="1.0" oninput="document.getElementById('strVal').textContent=this.value" style="width:100%;">
    </div>
    <button id="go" onclick="gen()">그리기 ▶</button>
    <div class="bar"><i id="prog"></i></div>
    <div id="status"></div>
  </div>
  <div id="gallery"></div>

<script>
// ComfyUI 주소 — 로컬이면 localhost:8188, 원격(tailnet)이면 같은 호스트의 8445 포트
const H = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8188'
  : location.protocol + '//' + location.hostname + ':8445';
let poseImage = null; // 업로드된 참조 이미지 파일명 (ComfyUI input)
let cnMode = "off";   // off | pose | canny
let cnStrength = 1.0;
// GPU 모드 확인/전환 (맥 등 원격에서 SSH 없이) — 페이지 로드 시 자동
async function checkMode(setTo){
  const bar = document.getElementById('modebar');
  const url = setTo ? '/mode?to='+setTo : '/mode';
  if(setTo){ bar.innerHTML='전환 중… (최대 1분)'; bar.style.background='#3a3d2a'; }
  try {
    const r = await fetch(url); const j = await r.json();
    bar.style.display='block';
    if(j.mode==='image'){
      bar.style.background='#1e3a2e';
      bar.innerHTML='🖼️ 이미지 모드 (생성 가능) &nbsp; <a href="#" onclick="checkMode(\'chat\');return false" style="color:#8ab;">→ 채팅 모드로</a>';
    } else {
      bar.style.background='#3a2828';
      bar.innerHTML='💬 지금 채팅 모드라 이미지 생성이 안 됩니다 &nbsp; <button onclick="checkMode(\'image\')" style="width:auto;padding:6px 14px;background:#4f7cff;">🖼️ 이미지 모드로 전환</button>';
    }
  } catch(e){ bar.style.display='none'; }
}
window.addEventListener('load', ()=>checkMode());
function wf(pos, neg, model, w, h, seed, hires, batch){
  const useCn = poseImage && cnMode!=="off";
  const posSrc = useCn ? ["20",0] : ["6",0];
  const negSrc = useCn ? ["20",1] : ["7",0];
  const g = {
    "3":{"class_type":"KSampler","inputs":{"seed":seed,"steps":28,"cfg":6.0,"sampler_name":"euler_ancestral","scheduler":"normal","denoise":1.0,"model":["4",0],"positive":posSrc,"negative":negSrc,"latent_image":["5",0]}},
    "4":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":model}},
    "5":{"class_type":"EmptyLatentImage","inputs":{"width":w,"height":h,"batch_size":batch}},
    "6":{"class_type":"CLIPTextEncode","inputs":{"text":pos,"clip":["4",1]}},
    "7":{"class_type":"CLIPTextEncode","inputs":{"text":neg,"clip":["4",1]}},
    "8":{"class_type":"VAEDecode","inputs":{"samples":["3",0],"vae":["4",2]}},
    "9":{"class_type":"SaveImage","inputs":{"filename_prefix":"simple","images":["8",0]}}
  };
  if(poseImage && cnMode!=="off"){
    g["16"]={"class_type":"LoadImage","inputs":{"image":poseImage}};
    if(cnMode==="pose"){
      // 자세: OpenPose 관절 추출 → 전용 pose ControlNet
      g["17"]={"class_type":"OpenposePreprocessor","inputs":{"image":["16",0],"detect_hand":"enable","detect_body":"enable","detect_face":"enable","resolution":1024}};
      g["18"]={"class_type":"ControlNetLoader","inputs":{"control_net_name":"controlnet-openpose-sdxl.safetensors"}};
    } else {
      // 구도: Canny 윤곽 추출 → Union ControlNet (canny 타입)
      g["17"]={"class_type":"CannyEdgePreprocessor","inputs":{"image":["16",0],"low_threshold":100,"high_threshold":200,"resolution":1024}};
      g["18b"]={"class_type":"ControlNetLoader","inputs":{"control_net_name":"controlnet-union-sdxl-promax.safetensors"}};
      g["18"]={"class_type":"SetUnionControlNetType","inputs":{"control_net":["18b",0],"type":"canny/lineart/anime_lineart/mlsd"}};
    }
    g["20"]={"class_type":"ControlNetApplyAdvanced","inputs":{"positive":["6",0],"negative":["7",0],"control_net":["18",0],"image":["17",0],"strength":cnStrength,"start_percent":0.0,"end_percent":1.0,"vae":["4",2]}};
  }
  if(hires>0){
    // 1차 latent를 배율만큼 업스케일 후 2차 정제 (denoise 0.5) → 디테일·해상도↑
    g["10"]={"class_type":"LatentUpscaleBy","inputs":{"samples":["3",0],"upscale_method":"nearest-exact","scale_by":hires}};
    g["11"]={"class_type":"KSampler","inputs":{"seed":seed+1,"steps":16,"cfg":6.0,"sampler_name":"euler_ancestral","scheduler":"normal","denoise":0.5,"model":["4",0],"positive":posSrc,"negative":negSrc,"latent_image":["10",0]}};
    g["8"].inputs.samples=["11",0];   // VAEDecode가 2차 결과를 받도록
  }
  return g;
}
const S = document.getElementById('status');
const P = document.getElementById('prog');
const B = document.getElementById('go');
// 포즈 참조 이미지 업로드 (8189 서버 → ComfyUI input)
async function uploadPose(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    S.textContent = '참조 사진 올리는 중…';
    try {
      const r = await fetch('/upload', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({image: rd.result})});
      const j = await r.json();
      poseImage = j.filename;
      document.getElementById('posePreview').style.display='block';
      document.getElementById('posePreview').innerHTML = '✓ 이 참조로 그립니다: <img src="'+rd.result+'" style="height:60px;border-radius:6px;vertical-align:middle;margin-left:8px;">';
      document.getElementById('poseClear').style.display='block';
      document.getElementById('poseBtn').textContent = '📎 다른 사진으로 교체';
      S.textContent = '참조 자세 준비됨 — 프롬프트 쓰고 그리기';
    } catch(e){ S.textContent = '업로드 실패'; }
  };
  rd.readAsDataURL(f);
}
function clearPose(){
  poseImage = null;
  document.getElementById('posePreview').style.display='none';
  document.getElementById('poseClear').style.display='none';
  document.getElementById('poseBtn').textContent = '📎 참조 사진 올리기';
  document.getElementById('poseFile').value='';
  S.textContent = '참조 해제됨';
}
// 제어 모드 UI 토글 + 예시 프리셋 로드
function updateCnUI(){
  cnMode = document.getElementById('cnmode').value;
  document.getElementById('cnpanel').style.display = cnMode==="off" ? "none" : "flex";
  if(cnMode!=="off" && !document.getElementById('presets').dataset.loaded) loadPresets();
}
async function loadPresets(){
  try {
    const r = await fetch('/presets'); const list = await r.json();
    const P = document.getElementById('presets'); P.innerHTML = '<span style="color:#888;font-size:12px;width:100%;">또는 예시 포즈 선택:</span>';
    for(const p of list){
      const im = document.createElement('img');
      im.src = H+'/view?filename='+encodeURIComponent(p)+'&type=input&subfolder=presets';
      im.title = p; im.style.cssText='height:70px;border-radius:6px;cursor:pointer;border:2px solid transparent;';
      im.onclick = ()=>{ poseImage='presets/'+p;
        document.querySelectorAll('#presets img').forEach(x=>x.style.border='2px solid transparent');
        im.style.border='2px solid #4f7cff';
        document.getElementById('posePreview').style.display='none';
        S.textContent='예시 포즈 선택됨 — 프롬프트 쓰고 그리기'; };
      P.appendChild(im);
    }
    P.dataset.loaded='1';
  } catch(e){}
}
// 한국어 → 영어 변환 (오프라인 Argos, 8189 서버)
async function toEng(){
  const box = document.getElementById('prompt');
  const t = box.value.trim();
  if(!t){ S.textContent='먼저 그릴 내용을 쓰세요'; return; }
  const btn = document.getElementById('tr');
  btn.disabled = true; btn.textContent = '변환 중…';
  try {
    const r = await fetch('/translate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text:t})});
    const j = await r.json();
    if(j.text){ box.value = j.text; S.textContent = '영어로 변환됨 ✓ (필요하면 태그를 다듬으세요)'; }
  } catch(e){ S.textContent = '변환 실패 — 그냥 영어로 써도 됩니다'; }
  btn.disabled = false; btn.textContent = '🇰🇷→🇺🇸 한국어를 영어 태그로 변환';
}
// 모델별 품질 태그 자동 삽입 (이게 품질의 핵심 — 특히 Pony는 score 태그 필수)
const QUAL = {
  "Illustrious-XL-v2.0.safetensors": "masterpiece, best quality, amazing quality, very aesthetic, absurdres, ",
  "NoobAI-XL-v1.1.safetensors": "masterpiece, best quality, newest, very aesthetic, absurdres, ",
  "Pony-Diffusion-v6-XL.safetensors": "score_9, score_8_up, score_7_up, source_anime, masterpiece, best quality, "
};
const NEG_BASE = "lowres, bad quality, worst quality, jpeg artifacts, blurry, watermark, signature, text, bad anatomy, bad hands, extra digits, missing fingers, ";
async function gen(){
  const [w,h] = document.getElementById('size').value.split('x').map(Number);
  const seed = Math.floor(Math.random()*1e15);
  const model = document.getElementById('model').value;
  const auto = document.getElementById('autoq').checked;
  let pos = document.getElementById('prompt').value;
  let neg = document.getElementById('neg').value;
  if(auto){
    pos = (QUAL[model]||"") + pos;
    neg = NEG_BASE + (model.includes("Pony") ? "score_1, score_2, score_3, " : "") + neg;
  }
  const hires = Number(document.getElementById('hires').value);
  const batch = Number(document.getElementById('batch').value);
  cnMode = document.getElementById('cnmode').value;
  cnStrength = Number(document.getElementById('strength').value);
  const body = { prompt: wf(pos, neg, model, w, h, seed, hires, batch) };
  const perImg = (hires>=2 ? 265 : hires>=1.5 ? 150 : 55) + (poseImage?40:0);
  const est = Math.round(perImg*batch/60*10)/10; // 대략 예상 분
  B.disabled = true; P.style.width='5%'; S.textContent='생성 중… (약 '+est+'분, '+batch+'장)';
  document.getElementById('gallery').innerHTML='';
  try {
    const r = await fetch(H+'/prompt', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    const id = j.prompt_id;
    if(!id){ S.textContent='오류: '+JSON.stringify(j).slice(0,120); B.disabled=false; return; }
    const maxPoll = 60 + batch*Math.ceil(perImg/2)*1.5; // 장수·배율에 따라 대기 확장
    let done=false;
    for(let i=0;i<maxPoll && !done;i++){
      await new Promise(s=>setTimeout(s,2000));
      P.style.width = Math.min(90, 5+i*(80/maxPoll))+'%';
      const hr = await fetch(H+'/history/'+id); const hj = await hr.json();
      if(hj[id] && hj[id].status && hj[id].status.completed){
        const outs = hj[id].outputs; const G = document.getElementById('gallery'); G.innerHTML='';
        let n=0;
        for(const k in outs){ if(outs[k].images){
          for(const im of outs[k].images){
            const url = H+'/view?filename='+encodeURIComponent(im.filename)+'&subfolder='+encodeURIComponent(im.subfolder||'')+'&type='+im.type;
            const img = document.createElement('img'); img.src=url; img.className='thumb'; G.appendChild(img); n++;
          }
        }}
        done=true; S.textContent='완료 ✓ '+n+'장 (~/사진/strix-ai 에 저장됨)';
      }
    }
    P.style.width='100%'; if(!done) S.textContent='시간 초과 — 장수를 줄이거나 다시 시도';
  } catch(e){ S.textContent='연결 오류 — ComfyUI(8188)가 켜져 있나요?'; }
  B.disabled=false; setTimeout(()=>P.style.width='0',800);
}
</script>
</body>
</html>
