<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRIX 이미지 생성</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--bg:#0A0C10;--panel:#0F1218;--line:#1E2530;--fg:#ECEEF1;--dim:#828A94;--faint:#4A515C;--grn:#4DE08A;--grn-d:#2C9E5F;--grn-bg:#0E1E16;--red:#F0645A}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Nanum Gothic Coding","JetBrains Mono",ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);
       display:flex;flex-direction:column;align-items:center;padding:22px 18px 60px;gap:14px;font-size:15px}
  h1{font-size:22px;margin:6px 0 0;color:var(--fg);font-weight:700}
  h1::before{content:"$ ";color:var(--grn)}
  .sub{color:var(--dim);font-size:13px;margin:0 0 6px}
  .panel{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px}
  label{font-size:13px;color:var(--dim);margin-bottom:-4px}
  textarea,select,input{width:100%;padding:11px 12px;border:1px solid var(--line);background:#070A0E;color:var(--fg);
         font-size:15px;font-family:inherit}
  textarea{min-height:88px;resize:vertical}
  textarea:focus,select:focus,input:focus{outline:none;border-color:var(--grn)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  button{padding:13px;border:1px solid var(--grn-d);background:var(--grn-bg);color:var(--grn);
         font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  button:hover{background:var(--grn);color:#04110A}
  button:disabled{border-color:var(--line);background:var(--panel);color:var(--dim);cursor:wait}
  #status{text-align:center;color:var(--dim);font-size:14px;min-height:20px}
  #gallery{width:100%;max-width:600px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .thumb{width:100%;border:1px solid var(--line)}
  .bar{height:6px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--grn);transition:width .2s}
  optgroup{background:#070A0E;color:var(--dim);font-style:normal} option{background:#070A0E;color:var(--fg)}
  a{color:var(--grn)}
</style>
</head>
<body>
  <h1>STRIX 이미지 생성</h1>
  <p class="sub">무검열 로컬 이미지 (Illustrious / NoobAI / Pony) — <a style="color:#4DE08A;font-size:13px;text-decoration:none;" href="/simple-video.html">🎬 영상 생성으로</a></p>
  <div id="modebar" style="width:100%; max-width:560px; display:none; padding:12px; border-radius:10px; margin-bottom:4px; text-align:center;"></div>
  <div class="panel">
    <label>무엇을 그릴까요? <span style="color:#4DE08A">(한국어로 써도 OK — 아래 변환 버튼)</span></label>
    <textarea id="prompt" placeholder="한국어: 흰머리 소녀, 기모노, 벚꽃 정원   또는   영어 태그: 1girl, white hair, kimono, cherry blossoms"></textarea>
    <button id="tr" onclick="toEng()" style="background:#0E1E16;color:#4DE08A;border:1px solid #2C9E5F; padding:10px; font-size:14px;">🇰🇷→🇺🇸 한국어를 영어 태그로 변환</button>
    <label>빼고 싶은 것 (선택 — 비워두면 자동)</label>
    <input id="neg" value="">
    <div class="row">
      <div>
        <label>모델</label>
        <select id="model" onchange="updateModelUI()">
          <optgroup label="SDXL (빠름 ~1-2분, 태그식 프롬프트)">
            <option>Animagine-XL-4.0.safetensors</option>
            <option>Illustrious-XL-v2.0.safetensors</option>
            <option>NoobAI-XL-v1.1.safetensors</option>
            <option>Pony-Diffusion-v6-XL.safetensors</option>
            <option>RealVisXL-V5.safetensors</option>
          </optgroup>
          <optgroup label="FLUX (고품질, 문장식 프롬프트, 무검열)">
            <option value="FLUX-Abl-Q8">FLUX Abliterated · Q8 최고품질 (실사, ~7분)</option>
            <option value="FLUX-Abl-Q6">FLUX Abliterated · Q6 저메모리 (실사, ~7분)</option>
          </optgroup>
          <optgroup label="HiDream (무검열 정밀 · 한복·아시아 · 청크자동)">
            <option value="HiDream-Fast">HiDream Fast · 무검열 실사 (네거티브 O, ~6분/장)</option>
            <!-- Dev/Full/Uncensored: gfx1150에서 DiT 샘플링 행(2026-08-22 실측). 파일·배선은 미래 dGPU용 보존. -->
          </optgroup>
          <optgroup label="Z-Image (신규 6B · 동아시아 실사 최강 · 초고속)">
            <option value="Z-Image-Turbo">Z-Image Turbo · 8스텝 초고속 무검열 실사 (~1분)</option>
            <option value="Z-Image">Z-Image Base · 풀CFG 네거티브 고품질 (~2분)</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label>크기</label>
        <select id="size">
          <option value="1024x1024">정사각 1024</option>
          <option value="832x1216">세로 (인물)</option>
          <option value="1216x832">가로 (풍경)</option>
        </select>
      </div>
      <div>
        <label>장수</label>
        <select id="batch">
          <option value="1">1장</option>
          <option value="2">2장</option>
          <option value="4">4장</option>
          <option value="10">10장 (대량)</option>
          <option value="50">50장 (대량)</option>
          <option value="100">100장 (대량)</option>
          <option value="500">500장 (대량)</option>
          <option value="1000">1000장 (대량)</option>
        </select>
      </div>
    </div>
    <label style="display:flex; align-items:center; gap:8px; margin:0; cursor:pointer; color:#B9C2CE;">
      <input type="checkbox" id="autoq" checked style="width:auto;">
      품질 태그 자동 추가 (모델별 최적화 — Pony score 태그 등)
    </label>
    <label>🔍 고품질 (Hires Fix — 디테일·해상도↑)</label>
    <select id="hires">
      <option value="0">끄기 (빠름, ~1분)</option>
      <option value="1.5" selected>1.5배 정제 (~2.5분, 1248×1824)</option>
      <option value="2.0">2.0배 초고해상 (~4.5분, 1664×2432)</option>
    </select>
    <label style="margin-top:6px;">🎯 참조 이미지로 제어 (선택)</label>
    <select id="cnmode" onchange="updateCnUI()">
      <option value="off">끄기 (프롬프트만으로 생성)</option>
      <option value="pose">🕺 자세 — 참조의 포즈를 따라감</option>
      <option value="canny">📐 구도 — 참조의 윤곽/구도를 유지 (사진→애니 변환)</option>
      <option value="ipadapter">🎨 스타일/인물/빛 — 참조의 느낌·조명·인물을 반영 (IP-Adapter)</option>
    </select>
    <div id="cnpanel" style="display:none; flex-direction:column; gap:10px;">
      <div class="row" style="align-items:center;">
        <button id="poseBtn" onclick="document.getElementById('poseFile').click()" style="background:#141821;color:#ECEEF1;border:1px solid #2A3038; padding:10px; font-size:14px; flex:2;">📎 참조 사진 올리기</button>
        <button id="poseClear" onclick="clearPose()" style="background:#141821;color:#828A94;border:1px solid #1E2530; padding:10px; font-size:14px; flex:1; display:none;">✕ 해제</button>
      </div>
      <input type="file" id="poseFile" accept="image/*" style="display:none;" onchange="uploadPose(this)">
      <div id="posePreview" style="display:none; color:#828A94; font-size:13px;"></div>
      <div id="presets" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      <label style="margin:0; color:#9AA2AE;">제어 강도: <b id="strVal">1.0</b> <span style="color:#6B7686;font-size:12px;">(낮으면 자유, 높으면 참조에 충실)</span></label>
      <input type="range" id="strength" min="0.3" max="1.2" step="0.1" value="1.0" oninput="document.getElementById('strVal').textContent=this.value" style="width:100%;">
    </div>
    <button id="go" onclick="gen()">그리기 ▶</button>
    <button id="stopBtn" onclick="stopGen()" style="display:none; background:#1E0F0D;color:#F0645A;border:1px solid #6E2B26;">⏹ 중단 (대량 생성 멈춤)</button>
    <div class="bar"><i id="prog"></i></div>
    <div id="status"></div>
  </div>
  <div id="gallery"></div>

<script>
// ComfyUI 주소 — 로컬이면 localhost:8188, 원격(tailnet)이면 같은 호스트의 8445 포트
const H = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8188'
  : location.protocol + '//' + location.hostname + ':8445';
let poseImage = null; // 업로드된 참조 이미지 파일명 (ComfyUI input)
let cnMode = "off";   // off | pose | canny
let cnStrength = 1.0;
let stopFlag = false; // 대량 생성 중단 플래그
// GPU 모드 확인/전환 (맥 등 원격에서 SSH 없이) — 페이지 로드 시 자동
async function checkMode(setTo){
  const bar = document.getElementById('modebar');
  const url = setTo ? '/mode?to='+setTo : '/mode';
  if(setTo){ bar.innerHTML='전환 중… (최대 1분)'; bar.style.background='#1a1e10'; }
  try {
    const r = await fetch(url); const j = await r.json();
    bar.style.display='block';
    if(j.mode==='image'){
      bar.style.background='#0E1E16';
      bar.innerHTML='🖼️ 이미지 모드 (생성 가능) &nbsp; <a href="#" onclick="checkMode(\'chat\');return false" style="color:#4DE08A;">→ 채팅 모드로</a>';
    } else {
      bar.style.background='#1E0F0D';
      bar.innerHTML='💬 지금 채팅 모드라 이미지 생성이 안 됩니다 &nbsp; <button onclick="checkMode(\'image\')" style="width:auto;padding:6px 14px;background:#4DE08A;">🖼️ 이미지 모드로 전환</button>';
    }
  } catch(e){ bar.style.display='none'; }
}
window.addEventListener('load', ()=>checkMode());
// ===== FLUX (무검열 abliterated, GGUF) — SDXL과 완전히 다른 그래프 =====
// Q8이 Q6보다 빠르고(392s vs 412s @1024²) 품질도 위 — 기본값 Q8. Q6는 GTT 여유용(-2G).
// 1536² 네이티브는 --use-split-cross-attention 필수 (benchmarks/2026-08-21-flux-split-attention-gfx1150.md)
const FLUX_GGUF = {
  "FLUX-Abl-Q8": "T8-flux.1-dev-abliterated-V2-GGUF-Q8_0.gguf",
  "FLUX-Abl-Q6": "T8-flux.1-dev-abliterated-V2-GGUF-Q6_K.gguf"
};
// HiDream (무검열 abliterated Llama 인코더 + 진짜 네거티브). --gpu-only 필요, 연속부하 웨지 → 청크 자동재시작.
// 각 HiDream 변형: dit=파일명, steps/cfg=샘플러 설정, loader=gguf|unet(fp8)
//  Fast=16스텝 증류, Dev=28스텝 가이던스증류, Full=50스텝 실CFG, Uncensored=Full의 무검열 fp8 병합
const HIDREAM = {
  "HiDream-Fast":       { dit:"hidream-i1-fast-Q5_K_M.gguf",                     steps:16, cfg:1.0, loader:"gguf" },
  "HiDream-Dev":        { dit:"hidream-i1-dev-Q6_K.gguf",                         steps:28, cfg:1.0, loader:"gguf" },
  "HiDream-Full":       { dit:"hidream-i1-full-Q5_K_S.gguf",                      steps:50, cfg:5.0, loader:"gguf" },
  "HiDream-Uncensored": { dit:"hidream_i1_full_uncensored_fp8_v0.2.safetensors",  steps:50, cfg:5.0, loader:"unet" }
};
function isHidream(m){ return m in HIDREAM; }
function hidreamWf(pos, neg, w, h, seed, batch, cfg){
  const loader = cfg.loader==="unet"
    ? {"class_type":"UNETLoader","inputs":{"unet_name":cfg.dit,"weight_dtype":"fp8_e4m3fn"}}
    : {"class_type":"UnetLoaderGGUF","inputs":{"unet_name":cfg.dit}};
  return {
    "1":loader,
    "2":{"class_type":"ModelSamplingSD3","inputs":{"model":["1",0],"shift":3.0}},
    "3":{"class_type":"QuadrupleCLIPLoaderGGUF","inputs":{"clip_name1":"clip_l_hidream.safetensors","clip_name2":"clip_g_hidream.safetensors","clip_name3":"t5xxl-Q5_K_M.gguf","clip_name4":"llama-3.1-8b-abliterated-Q6_K.gguf"}},
    "4":{"class_type":"CLIPTextEncode","inputs":{"text":pos,"clip":["3",0]}},
    "5":{"class_type":"CLIPTextEncode","inputs":{"text":neg,"clip":["3",0]}},
    "6":{"class_type":"EmptySD3LatentImage","inputs":{"width":w,"height":h,"batch_size":batch}},
    "7":{"class_type":"VAELoader","inputs":{"vae_name":"hidream-ae.safetensors"}},
    "8":{"class_type":"KSampler","inputs":{"seed":seed,"steps":cfg.steps,"cfg":cfg.cfg,"sampler_name":"euler","scheduler":"normal","denoise":1.0,"model":["2",0],"positive":["4",0],"negative":["5",0],"latent_image":["6",0]}},
    "9":{"class_type":"VAEDecode","inputs":{"samples":["8",0],"vae":["7",0]}},
    "10":{"class_type":"SaveImage","inputs":{"filename_prefix":"hidream/img","images":["9",0]}}
  };
}
function isFlux(model){ return model in FLUX_GGUF; }
function fluxWf(pos, w, h, seed, hires, batch, model){
  // cfg=1 + FluxGuidance(3.5), euler/simple, 16채널 latent, bf16 VAE. 네거티브 없음(문장식 프롬프트)
  const g = {
    "1":{"class_type":"UnetLoaderGGUF","inputs":{"unet_name":FLUX_GGUF[model]}},
    "2":{"class_type":"DualCLIPLoader","inputs":{"clip_name1":"t5xxl_fp8_e4m3fn_scaled.safetensors","clip_name2":"clip_l.safetensors","type":"flux"}},
    "3":{"class_type":"VAELoader","inputs":{"vae_name":"flux-ae.safetensors"}},
    "4":{"class_type":"CLIPTextEncode","inputs":{"text":pos,"clip":["2",0]}},
    "5":{"class_type":"CLIPTextEncode","inputs":{"text":"","clip":["2",0]}},
    "6":{"class_type":"FluxGuidance","inputs":{"conditioning":["4",0],"guidance":3.5}},
    "7":{"class_type":"EmptySD3LatentImage","inputs":{"width":w,"height":h,"batch_size":batch}},
    "8":{"class_type":"KSampler","inputs":{"seed":seed,"steps":20,"cfg":1.0,"sampler_name":"euler","scheduler":"simple","denoise":1.0,"model":["1",0],"positive":["6",0],"negative":["5",0],"latent_image":["7",0]}},
    "9":{"class_type":"VAEDecode","inputs":{"samples":["8",0],"vae":["3",0]}},
    "10":{"class_type":"SaveImage","inputs":{"filename_prefix":"flux","images":["9",0]}}
  };
  if(hires>0){
    // FLUX 고해상은 ESRGAN 모델 업스케일(픽셀공간)로 — DiT 2차패스는 gfx1150에서 큰 토큰수 → ROCm 큐 wedge 위험(G11). 절대 latent 2차패스 쓰지 말 것.
    g["20"]={"class_type":"UpscaleModelLoader","inputs":{"model_name":"4x-UltraSharp.safetensors"}};
    g["21"]={"class_type":"ImageUpscaleWithModel","inputs":{"upscale_model":["20",0],"image":["9",0]}};
    g["22"]={"class_type":"ImageScaleBy","inputs":{"image":["21",0],"upscale_method":"lanczos","scale_by":hires/4}};  // 4x모델 → 목표배율로 축소
    g["10"].inputs.images=["22",0];
  }
  return g;
}
// Z-Image (신규 6B DiT, 동아시아 실사 최강, gfx1150 검증됨). 인코더 자동감지:
//  CLIPLoader type="lumina2" → qwen3_4b 인코더가 z_image.te로 라우팅(ComfyUI sd.py). ModelSamplingAuraFlow.
const ZIMAGE = {
  "Z-Image-Turbo": { dit:"z-image-turbo-Q8_0.gguf", steps:8,  cfg:1.0 },  // 8-step 증류(네거티브 무효)
  "Z-Image":       { dit:"z-image-Q8_0.gguf",       steps:24, cfg:4.5 }   // base: 풀CFG+진짜 네거티브
};
function isZimage(m){ return m in ZIMAGE; }
function zimageWf(pos, neg, w, h, seed, hires, batch, cfg){
  const g = {
    "1":{"class_type":"UnetLoaderGGUF","inputs":{"unet_name":cfg.dit}},
    "2":{"class_type":"ModelSamplingAuraFlow","inputs":{"model":["1",0],"shift":3.0}},
    "3":{"class_type":"CLIPLoader","inputs":{"clip_name":"qwen_3_4b_fp8_mixed.safetensors","type":"lumina2"}},
    "4":{"class_type":"CLIPTextEncode","inputs":{"text":pos,"clip":["3",0]}},
    "5":{"class_type":"CLIPTextEncode","inputs":{"text":neg||"","clip":["3",0]}},
    "6":{"class_type":"EmptySD3LatentImage","inputs":{"width":w,"height":h,"batch_size":batch}},
    "7":{"class_type":"VAELoader","inputs":{"vae_name":"z_image_ae.safetensors"}},
    "8":{"class_type":"KSampler","inputs":{"seed":seed,"steps":cfg.steps,"cfg":cfg.cfg,"sampler_name":"euler","scheduler":"simple","denoise":1.0,"model":["2",0],"positive":["4",0],"negative":["5",0],"latent_image":["6",0]}},
    "9":{"class_type":"VAEDecode","inputs":{"samples":["8",0],"vae":["7",0]}},
    "10":{"class_type":"SaveImage","inputs":{"filename_prefix":"zimage/img","images":["9",0]}}
  };
  if(hires>0){  // ESRGAN 픽셀 업스케일(FLUX와 동일 — latent 2차패스는 wedge 위험)
    g["20"]={"class_type":"UpscaleModelLoader","inputs":{"model_name":"4x-UltraSharp.safetensors"}};
    g["21"]={"class_type":"ImageUpscaleWithModel","inputs":{"upscale_model":["20",0],"image":["9",0]}};
    g["22"]={"class_type":"ImageScaleBy","inputs":{"image":["21",0],"upscale_method":"lanczos","scale_by":hires/4}};
    g["10"].inputs.images=["22",0];
  }
  return g;
}
function wf(pos, neg, model, w, h, seed, hires, batch){
  if(isFlux(model)) return fluxWf(pos, w, h, seed, hires, batch, model);
  if(isZimage(model)) return zimageWf(pos, neg, w, h, seed, hires, batch, ZIMAGE[model]);
  if(isHidream(model)) return hidreamWf(pos, neg, w, h, seed, batch, HIDREAM[model]);
  const useCn = poseImage && (cnMode==="pose"||cnMode==="canny");
  const useIpa = poseImage && cnMode==="ipadapter";
  const posSrc = useCn ? ["20",0] : ["6",0];
  const negSrc = useCn ? ["20",1] : ["7",0];
  const modelSrc = useIpa ? ["31",0] : ["4",0];   // IP-Adapter가 모델을 수정
  const g = {
    "3":{"class_type":"KSampler","inputs":{"seed":seed,"steps":28,"cfg":6.0,"sampler_name":"euler_ancestral","scheduler":"normal","denoise":1.0,"model":modelSrc,"positive":posSrc,"negative":negSrc,"latent_image":["5",0]}},
    "4":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":model}},
    "5":{"class_type":"EmptyLatentImage","inputs":{"width":w,"height":h,"batch_size":batch}},
    "6":{"class_type":"CLIPTextEncode","inputs":{"text":pos,"clip":["4",1]}},
    "7":{"class_type":"CLIPTextEncode","inputs":{"text":neg,"clip":["4",1]}},
    "8":{"class_type":"VAEDecode","inputs":{"samples":["3",0],"vae":["4",2]}},
    "9":{"class_type":"SaveImage","inputs":{"filename_prefix":"simple","images":["8",0]}}
  };
  if(useCn){
    g["16"]={"class_type":"LoadImage","inputs":{"image":poseImage}};
    if(cnMode==="pose"){
      // 자세: OpenPose 관절 추출 → 전용 pose ControlNet
      g["17"]={"class_type":"OpenposePreprocessor","inputs":{"image":["16",0],"detect_hand":"enable","detect_body":"enable","detect_face":"enable","resolution":1024}};
      g["18"]={"class_type":"ControlNetLoader","inputs":{"control_net_name":"controlnet-openpose-sdxl.safetensors"}};
    } else {
      // 구도: Canny 윤곽 추출 → Union ControlNet (canny 타입)
      g["17"]={"class_type":"CannyEdgePreprocessor","inputs":{"image":["16",0],"low_threshold":100,"high_threshold":200,"resolution":1024}};
      g["18b"]={"class_type":"ControlNetLoader","inputs":{"control_net_name":"controlnet-union-sdxl-promax.safetensors"}};
      g["18"]={"class_type":"SetUnionControlNetType","inputs":{"control_net":["18b",0],"type":"canny/lineart/anime_lineart/mlsd"}};
    }
    g["20"]={"class_type":"ControlNetApplyAdvanced","inputs":{"positive":["6",0],"negative":["7",0],"control_net":["18",0],"image":["17",0],"strength":cnStrength,"start_percent":0.0,"end_percent":1.0,"vae":["4",2]}};
  }
  if(useIpa){
    // IP-Adapter: 참조 이미지의 스타일·인물·조명을 모델에 주입(SDXL). weight=강도 슬라이더.
    g["30"]={"class_type":"LoadImage","inputs":{"image":poseImage}};
    g["31a"]={"class_type":"IPAdapterUnifiedLoader","inputs":{"model":["4",0],"preset":"PLUS (high strength)"}};
    g["31"]={"class_type":"IPAdapterAdvanced","inputs":{"model":["31a",0],"ipadapter":["31a",1],"image":["30",0],"weight":cnStrength,"weight_type":"linear","combine_embeds":"concat","start_at":0.0,"end_at":1.0,"embeds_scaling":"V only"}};
  }
  if(hires>0){
    // 1차 latent를 배율만큼 업스케일 후 2차 정제 (denoise 0.5) → 디테일·해상도↑
    g["10"]={"class_type":"LatentUpscaleBy","inputs":{"samples":["3",0],"upscale_method":"nearest-exact","scale_by":hires}};
    g["11"]={"class_type":"KSampler","inputs":{"seed":seed+1,"steps":16,"cfg":6.0,"sampler_name":"euler_ancestral","scheduler":"normal","denoise":0.5,"model":modelSrc,"positive":posSrc,"negative":negSrc,"latent_image":["10",0]}};
    g["8"].inputs.samples=["11",0];   // VAEDecode가 2차 결과를 받도록
  }
  return g;
}

// 모델 종류에 따른 UI 안내 (FLUX는 문장식·느림·ControlNet 없음)
function updateModelUI(){
  const model = document.getElementById('model').value;
  const flux = isFlux(model);
  const hd = isHidream(model);
  const cn = document.getElementById('cnmode');
  const box = document.getElementById('prompt');
  if(hd){
    cn.value="off"; cn.disabled=true; updateCnUI();
    const big = document.getElementById('size').querySelector('option[value="1536x1536"]');
    if(big){ if(document.getElementById('size').value==="1536x1536") document.getElementById('size').value="1024x1024"; big.remove(); }
    box.placeholder = "문장으로 묘사 + 빼고 싶은 건 아래 네거티브 칸에 (예: A Korean woman in a jade-green hanbok, palace, autumn). 무검열, 동아시아/한복 정확.";
    S.textContent = "🟢 HiDream 무검열 정밀 — 자연어 프롬프트 + 진짜 네거티브. 장수 여러 개면 청크로 자동 재시작(웨지 회피). ~6분/장.";
    return;
  }
  if(isZimage(model)){
    cn.value="off"; cn.disabled=true; updateCnUI();
    const szEl=document.getElementById('size'), bigZ=szEl.querySelector('option[value="1536x1536"]');
    if(bigZ){ if(szEl.value==="1536x1536") szEl.value="1024x1024"; bigZ.remove(); }
    box.placeholder = "문장으로 묘사하세요 (예: a photorealistic portrait of a Korean woman in a white hanbok, hanok courtyard, soft window light). 동아시아 실사 최강.";
    S.textContent = model==="Z-Image-Turbo"
      ? "🟢 Z-Image Turbo — 8스텝 초고속 무검열 실사. 네거티브 무효(cfg1). ~1분."
      : "🟢 Z-Image Base — 풀CFG + 진짜 네거티브 고품질. ~2분.";
    return;
  }
  // 1536² 네이티브는 FLUX 전용 (split attention 언락, SDXL은 학습해상도 밖이라 비노출)
  const sz = document.getElementById('size');
  const big = sz.querySelector('option[value="1536x1536"]');
  if(flux && !big){
    const o = document.createElement('option');
    o.value = "1536x1536"; o.textContent = "정사각 1536 (최대, ~19분)";
    sz.appendChild(o);
  } else if(!flux && big){
    if(sz.value === "1536x1536") sz.value = "1024x1024";
    big.remove();
  }
  if(flux){
    cn.value="off"; cn.disabled=true; updateCnUI();
    box.placeholder = "문장으로 묘사하세요 (예: a photorealistic portrait of a woman in a hanbok, golden hour, cinematic lighting). 태그 나열보다 자연스러운 영어 문장이 좋습니다.";
    S.textContent = "🌟 FLUX 무검열·최고품질 — 문장식 프롬프트. 1024² ~7분, 1536² ~19분 (네이티브). 번역 버튼으로 한국어→영어 문장 그대로 쓰면 됩니다.";
  } else {
    cn.disabled=false;
    box.placeholder = "";
    S.textContent = "";
  }
}

// 모델별 품질 태그 자동 삽입 (이게 품질의 핵심 — 특히 Pony는 score 태그 필수)
const QUAL = {
  "Animagine-XL-4.0.safetensors": "masterpiece, high score, great score, absurdres, very aesthetic, ",
  "Illustrious-XL-v2.0.safetensors": "masterpiece, best quality, amazing quality, very aesthetic, absurdres, ",
  "NoobAI-XL-v1.1.safetensors": "masterpiece, best quality, newest, very aesthetic, absurdres, ",
  "Pony-Diffusion-v6-XL.safetensors": "score_9, score_8_up, score_7_up, source_anime, masterpiece, best quality, ",
  "RealVisXL-V5.safetensors": "photorealistic, RAW photo, best quality, highly detailed, 8k uhd, sharp focus, "
};
// 실사 모델은 애니 네거티브(anime artifacts)와 다름
const NEG_ANIME = "lowres, bad quality, worst quality, jpeg artifacts, blurry, watermark, signature, text, bad anatomy, bad hands, extra digits, missing fingers, ";
const NEG_REAL = "lowres, worst quality, low quality, blurry, watermark, text, bad anatomy, bad hands, extra digits, deformed, cartoon, anime, 3d render, ";
async function hidreamGen(pos, neg, w, h, count){
  const hcfg=HIDREAM[document.getElementById('model').value];
  let produced=0, sinceRestart=0; const seedBase=Math.floor(Math.random()*1e15);
  S.textContent='HiDream 준비 — GPU 인코더 모드로 전환(~40초)…'; try{ await fetch('/comfyui-mode?vram=gpu-only'); }catch(e){}
  async function restart(msg){ S.textContent=msg; try{ await fetch('/comfyui-restart'); }catch(e){} sinceRestart=0; await new Promise(s=>setTimeout(s,2000)); }
  function addImg2(im){ const url=H+'/view?filename='+encodeURIComponent(im.filename)+'&subfolder='+encodeURIComponent(im.subfolder||'')+'&type='+im.type;
    const g=document.getElementById('gallery'); const img=document.createElement('img'); img.src=url; img.className='thumb'; g.insertBefore(img,g.firstChild);
    while(g.children.length>12) g.removeChild(g.lastChild); }
  while(produced<count && !stopFlag){
    const per=Math.min(2, count-produced);
    let jid=null;
    try{ jid=(await (await fetch(H+'/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:hidreamWf(pos,neg,w,h,seedBase+produced,per,hcfg)})})).json()).prompt_id; }catch(e){}
    if(!jid){ await restart('ComfyUI 재시작(웨지 복구)…'); continue; }
    let done=false;
    for(let i=0;i<100 && !done && !stopFlag;i++){
      await new Promise(s=>setTimeout(s,10000));
      let hj={}; try{ hj=await (await fetch(H+'/history/'+jid)).json(); }catch(e){}
      if(hj[jid]&&hj[jid].status&&hj[jid].status.completed){
        for(const k in hj[jid].outputs){ if(hj[jid].outputs[k].images) for(const im of hj[jid].outputs[k].images) addImg2(im); }
        done=true;
      }
      P.style.width=Math.min(95,(produced/count)*100+(i/100)*(100/Math.max(1,count)))+'%';
      S.textContent='HiDream 생성 중… '+produced+'/'+count+'장 (무검열)';
    }
    if(done){ produced+=per; sinceRestart+=per; if(sinceRestart>=4 && produced<count) await restart('웨지 예방 재시작…(~40초)'); }
    else if(!stopFlag){ await restart('스톨 감지 — ComfyUI 재시작…'); }
  }
  try{ await fetch('/comfyui-mode?vram=dynamic'); }catch(e){}
  S.textContent = stopFlag ? ('중단됨 — '+produced+'장 저장됨 (FLUX/SDXL 모드 복원됨)') : ('✓ HiDream 완료 '+produced+'장 (무검열, ~/사진/strix-ai/hidream)');
}
async function gen(){
  const [w,h] = document.getElementById('size').value.split('x').map(Number);
  const seed = Math.floor(Math.random()*1e15);
  const model = document.getElementById('model').value;
  const auto = document.getElementById('autoq').checked;
  let pos = document.getElementById('prompt').value;
  let neg = document.getElementById('neg').value;
  const flux = isFlux(model);
  if(auto && !flux && !isHidream(model) && !isZimage(model)){   // FLUX·HiDream·Z-Image는 자연어 프롬프트 — 애니 태그/네거티브 붙이지 않음
    pos = (QUAL[model]||"") + pos;
    const negBase = model.includes("RealVis") ? NEG_REAL : NEG_ANIME;
    neg = negBase + (model.includes("Pony") ? "score_1, score_2, score_3, " : "") + neg;
  }
  const hires = Number(document.getElementById('hires').value);
  const batch = Number(document.getElementById('batch').value);
  if(isHidream(model)){
    const hneg = (neg && neg.trim()) ? neg : "lowres, bad anatomy, deformed hands, extra fingers, blurry, watermark, text, jpeg artifacts";
    document.getElementById('gallery').innerHTML='';
    B.disabled=true; stopFlag=false; document.getElementById('stopBtn').style.display='block'; P.style.width='4%';
    await hidreamGen(pos, hneg, w, h, batch);
    document.getElementById('stopBtn').style.display='none'; B.disabled=false; setTimeout(()=>P.style.width='0',800);
    return;
  }
  cnMode = (flux||isZimage(model)) ? "off" : document.getElementById('cnmode').value;  // FLUX·Z-Image는 SDXL ControlNet 비호환
  cnStrength = Number(document.getElementById('strength').value);
  // FLUX ETA 실측(split attention, 20스텝): ≤1024² ≈400s, 1536² ≈1150s — attention 초선형이라
  // 픽셀 비례식 쓰지 말 것. hires는 ESRGAN(픽셀 업스케일) ~100초 추가(실측 492-392)
  const perImg = flux
    ? ((w*h) > 1024*1024+1 ? 1150 : 400) + (hires>0 ? 100 : 0)
    : (hires>=2 ? 265 : hires>=1.5 ? 150 : 55) + (poseImage?40:0);
  const G = document.getElementById('gallery'); G.innerHTML=''; const seen=new Set();
  function addImg(im){
    const url=H+'/view?filename='+encodeURIComponent(im.filename)+'&subfolder='+encodeURIComponent(im.subfolder||'')+'&type='+im.type;
    const img=document.createElement('img'); img.src=url; img.className='thumb'; G.insertBefore(img,G.firstChild);
    while(G.children.length>12) G.removeChild(G.lastChild); // 최근 12장만(1000장 대비 브라우저 보호)
  }
  B.disabled=true; stopFlag=false; document.getElementById('stopBtn').style.display='block'; P.style.width='5%';
  try {
    try{ await fetch('/comfyui-mode?vram=dynamic'); }catch(e){}
    if(batch<=4){
      const est=Math.round(perImg*batch/60*10)/10;
      S.textContent='생성 중… (약 '+est+'분, '+batch+'장)';
      const j=await (await fetch(H+'/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:wf(pos,neg,model,w,h,seed,hires,batch)})})).json();
      const id=j.prompt_id;
      if(!id){ S.textContent='오류: '+JSON.stringify(j).slice(0,120); }
      else{
        const maxPoll=60+batch*Math.ceil(perImg/2)*1.5; let done=false;
        for(let i=0;i<maxPoll&&!done&&!stopFlag;i++){
          await new Promise(s=>setTimeout(s,2000)); P.style.width=Math.min(90,5+i*(80/maxPoll))+'%';
          const hj=await (await fetch(H+'/history/'+id)).json();
          if(hj[id]&&hj[id].status&&hj[id].status.completed){
            for(const k in hj[id].outputs){ if(hj[id].outputs[k].images) for(const im of hj[id].outputs[k].images) addImg(im); }
            done=true; S.textContent='완료 ✓ '+batch+'장 (~/사진/strix-ai 저장)';
          }
        }
        if(!done&&!stopFlag) S.textContent='시간 초과 — 다시 시도';
      }
    } else {
      // 대량: N장을 개별 작업으로 순차 큐 (한 번에 큰 배치는 GTT 초과 → 1장씩 큐잉)
      const N=batch; const ids=[]; const eta=Math.round(perImg*N/60);
      S.textContent='대량 생성 준비… '+N+'장 큐 등록 중 (예상 총 '+eta+'분)';
      for(let i=0;i<N&&!stopFlag;i++){
        try{ const j=await (await fetch(H+'/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:wf(pos,neg,model,w,h,seed+i,hires,1)})})).json(); if(j.prompt_id) ids.push(j.prompt_id); }catch(e){}
      }
      const total=ids.length; let doneCount=0;
      while(doneCount<total&&!stopFlag){
        await new Promise(s=>setTimeout(s,3000));
        const q=await (await fetch(H+'/queue')).json();
        const remaining=(q.queue_running?q.queue_running.length:0)+(q.queue_pending?q.queue_pending.length:0);
        doneCount=total-remaining; P.style.width=Math.min(96,(doneCount/total)*100)+'%';
        S.textContent='대량 생성 중… '+doneCount+'/'+total+'장 완료 (총 예상 '+eta+'분, 최근 12장만 표시)';
        const hist=await (await fetch(H+'/history?max_items=14')).json();
        for(const pid in hist){ if(seen.has(pid))continue; const v=hist[pid];
          if(v.status&&v.status.completed){ seen.add(pid); for(const k in v.outputs){ if(v.outputs[k].images) for(const im of v.outputs[k].images) addImg(im); } } }
      }
      if(stopFlag) S.textContent='중단됨 — '+doneCount+'/'+total+'장까지 저장됨 (~/사진/strix-ai)';
      else { P.style.width='100%'; S.textContent='✓ 대량 완료 '+total+'장 (전부 ~/사진/strix-ai 저장)'; }
    }
  } catch(e){ S.textContent='연결 오류 — ComfyUI(이미지 모드)가 켜져 있나요?'; }
  document.getElementById('stopBtn').style.display='none';
  B.disabled=false; setTimeout(()=>P.style.width='0',800);
}
async function stopGen(){
  stopFlag=true; S.textContent='중단 요청됨…';
  try{ await fetch(H+'/interrupt',{method:'POST'}); await fetch(H+'/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clear:true})}); }catch(e){}
}
