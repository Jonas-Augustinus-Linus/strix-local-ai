<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>strix@890m · gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0C10;--panel:#0F1218;--line:#1E2530;--fg:#B9C2CE;--dim:#6B7686;--faint:#454F5E;
  --grn:#4DE08A;--grn-d:#2C9E5F;--grn-bg:#0E1E16;--amb:#E0A64D;--cyn:#4EC9E0;--red:#F0645A;--red-bg:#1E0F0D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Nanum Gothic Coding","JetBrains Mono",ui-monospace,monospace;
  font-size:14px;padding:0 14px 50px;background-image:radial-gradient(1000px 400px at 50% -6%,#12161d 0,transparent 70%)}
.wrap{max-width:1160px;margin:0 auto}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
:focus-visible{outline:1px solid var(--grn);outline-offset:2px}
header{padding:24px 0 8px}
.pline{color:var(--dim);font-size:12.5px}.pline .g{color:var(--grn)}.pline .a{color:var(--amb)}
.pline a{color:var(--dim);border-bottom:1px dashed var(--faint)}.pline a:hover{color:var(--grn);border-color:var(--grn)}
.count{color:var(--dim);font-size:12.5px;margin-top:4px}.count b{color:var(--amb)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}
.chip{padding:5px 11px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--dim);cursor:pointer}
.chip:hover{border-color:var(--faint);color:var(--fg)}
.chip.on{background:var(--grn-bg);color:var(--grn);border-color:var(--grn-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.cell{position:relative;border:1px solid var(--line);background:var(--panel);aspect-ratio:1;cursor:pointer;overflow:hidden}
.cell:hover{border-color:var(--grn-d)}
.cell img{width:100%;height:100%;object-fit:cover;display:block;background:#070A0E}
.cell .meta{position:absolute;left:0;right:0;bottom:0;padding:14px 7px 4px;font-size:10px;color:var(--grn);
  background:linear-gradient(transparent,rgba(4,8,6,.85));pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .del{position:absolute;top:5px;right:5px;width:26px;height:26px;border:1px solid var(--line);
  background:rgba(10,12,16,.8);color:var(--dim);font-size:12px;cursor:pointer;display:grid;place-items:center;opacity:0;transition:.12s}
.cell:hover .del,.cell:focus-within .del{opacity:1}
.cell .del:hover{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--dim);padding:60px 0;font-size:13px}.empty::before{content:"# ";color:var(--grn-d)}
#lb{position:fixed;inset:0;background:rgba(4,6,9,.94);display:none;place-items:center;z-index:20;padding:18px}
#lb.show{display:grid}#lb img{max-width:100%;max-height:80vh;border:1px solid var(--line)}
#lb .cap{position:absolute;top:14px;left:16px;color:var(--grn);font-size:12.5px}
#lb .cap::before{content:"› "}
#lb .x{position:absolute;top:10px;right:16px;color:var(--fg);font-size:24px;cursor:pointer}
#lb .lbdel{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 18px;
  border:1px solid var(--red);background:var(--red-bg);color:var(--red);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
#lb .lbdel:hover{background:var(--red);color:#120605}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);opacity:0;background:#04110A;
  border:1px solid var(--grn-d);color:var(--grn);padding:9px 16px;font-size:13px;transition:.22s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#toast::before{content:"» "}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="pline"><span class="g">root@amd-ai-gt-370</span>:<span class="a">~/사진/strix-ai</span>$ ls -t &nbsp;<a href="./">[cd ../hub]</a></div>
    <div class="count" id="count">loading…</div>
  </header>
  <div class="bar" id="folders"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">no images</div>
</div>

<div id="lb">
  <span class="x" onclick="closeLb()">×</span>
  <div class="cap" id="lbcap"></div>
  <img id="lbimg" alt="">
  <button class="lbdel" onclick="delCur()">rm — 삭제</button>
</div>
<div id="toast"></div>

<script>
let items=[], folder="ALL", cur=null;
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);};
const sz=b=>b>1048576?(b/1048576).toFixed(1)+'M':Math.round(b/1024)+'K';
const label=f=>({'.':'other','fluxbatch':'hanbok','fluxhuman':'human','hidream':'hidream','qwentest':'qwen'})[f]||f;

async function load(){
  const r=await fetch('/list',{cache:'no-store'});
  if(r.status===401){location.href='/';return;}
  items=await r.json();
  const fset=[...new Set(items.map(i=>i.folder))].sort();
  const fb=$('folders');
  fb.innerHTML=`<button class="chip on" data-f="ALL">all (${items.length})</button>`+
    fset.map(f=>`<button class="chip" data-f="${f}">${label(f)} (${items.filter(i=>i.folder===f).length})</button>`).join('');
  fb.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{folder=c.dataset.f;
    fb.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));render();});
  render();
}
function render(){
  const list=folder==='ALL'?items:items.filter(i=>i.folder===folder);
  $('count').innerHTML=`<b>${list.length}</b> files`+(folder!=='ALL'?` · ${label(folder)}/`:'');
  $('empty').style.display=list.length?'none':'block';
  $('grid').innerHTML=list.map(i=>`<div class="cell" data-p="${encodeURIComponent(i.path)}">
    <img loading="lazy" src="/thumb?p=${encodeURIComponent(i.path)}" alt="">
    <div class="meta">${i.folder==='.'?'':i.folder+'/'} ${sz(i.size)}</div>
    <button class="del" title="rm" data-p="${encodeURIComponent(i.path)}">✕</button></div>`).join('');
  $('grid').querySelectorAll('.cell').forEach(c=>{
    c.querySelector('img').onclick=()=>openLb(decodeURIComponent(c.dataset.p));
    c.querySelector('.del').onclick=e=>{e.stopPropagation();delImg(decodeURIComponent(c.dataset.p));};
  });
}
function openLb(p){cur=p;$('lbimg').src='/full?p='+encodeURIComponent(p);$('lbcap').textContent=p;$('lb').classList.add('show');}
function closeLb(){$('lb').classList.remove('show');cur=null;}
function delCur(){if(cur){const p=cur;closeLb();delImg(p);}}
async function delImg(p){
  const name=p.split('/').pop();
  if(!confirm('rm '+name+' ?\n되돌릴 수 없습니다.'))return;
  const r=await fetch('/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})});
  if(r.ok){toast('rm: '+name);load();}else toast('rm failed');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
$('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
load();
</script>
</body>
</html>
